name: Update China IP Rules

on:
  schedule:
    # 每天 UTC 18:00 执行
    # 北京时间 / 日本时间都是凌晨 02:00
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download China IP lists
        run: |
          curl -fL \
            https://gaoyifan.github.io/china-operator-ip/china.txt \
            -o china.txt

          curl -fL \
            https://gaoyifan.github.io/china-operator-ip/china6.txt \
            -o china6.txt

      - name: Download Mihomo
        run: |
          curl -fL \
            https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-amd64-v3 \
            -o mihomo

          chmod +x mihomo

      - name: Convert to MRS
        run: |
          ./mihomo convert-ruleset ipcidr text china.txt china.mrs
          ./mihomo convert-ruleset ipcidr text china6.txt china6.mrs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add china.mrs china6.mrs

          if git diff --cached --quiet; then
            echo "Rules unchanged."
            exit 0
          fi

          git commit -m "Update China IP rules"
          git push
