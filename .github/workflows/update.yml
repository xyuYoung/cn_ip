name: Update China IP Rules

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库
      - name: Checkout
        uses: actions/checkout@v5

      # 2. 下载中国 IPv4 / IPv6 CIDR
      - name: Download China IP lists
        run: |
          set -e

          curl -fL \
            https://gaoyifan.github.io/china-operator-ip/china.txt \
            -o china.txt

          curl -fL \
            https://gaoyifan.github.io/china-operator-ip/china6.txt \
            -o china6.txt

      # 3. 检查下载结果
      - name: Check downloaded files
        run: |
          set -e

          test -s china.txt
          test -s china6.txt

          echo "IPv4 CIDR count: $(wc -l < china.txt)"
          echo "IPv6 CIDR count: $(wc -l < china6.txt)"

          echo "IPv4 file size:"
          ls -lh china.txt

          echo "IPv6 file size:"
          ls -lh china6.txt

      # 4. 下载最新版 Mihomo
      - name: Download latest Mihomo
        run: |
          set -e

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')

          echo "Mihomo version: $VERSION"

          URL=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '
              .assets[]
              | select(.name | test("^mihomo-linux-amd64.*\\.gz$"))
              | .browser_download_url
            ' \
            | head -n 1)

          echo "Download URL: $URL"

          test -n "$URL"

          curl -fL "$URL" -o mihomo.gz

          gunzip mihomo.gz
          chmod +x mihomo

      # 5. 将 TXT 转换成 Mihomo MRS
      - name: Convert to MRS
        run: |
          set -e

          ./mihomo convert-ruleset ipcidr text china.txt china.mrs
          ./mihomo convert-ruleset ipcidr text china6.txt china6.mrs

      # 6. 检查 MRS 是否生成成功
      - name: Check MRS files
        run: |
          set -e

          test -s china.mrs
          test -s china6.mrs

          echo "Generated MRS files:"
          ls -lh china.mrs china6.mrs

      # 7. 提交并推送更新
      - name: Commit changes
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add china.mrs china6.mrs

          if git diff --cached --quiet; then
            echo "Rules unchanged."
            exit 0
          fi

          git commit -m "Update China IP rules"
          git push

      # 8. 清理临时文件
      - name: Clean temporary files
        if: always()
        run: |
          rm -f china.txt
          rm -f china6.txt
          rm -f mihomo
          rm -f mihomo.gz
